<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- 背景渐变：深靛蓝 -> 紫罗兰（Material 3） -->
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#1C1917"/>
  <stop offset="0.5" stop-color="#C2410C"/>
  <stop offset="1" stop-color="#FB7185"/>
</linearGradient>

    <!-- 紫卡渐变 -->
    <linearGradient id="purpleCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- 蓝卡渐变 -->
    <linearGradient id="blueCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>

    <!-- 白卡渐变 -->
    <linearGradient id="whiteCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9EDFB"/>
    </linearGradient>

    <!-- 金色芯片渐变 -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCD34D"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- 阴影 -->
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1E1B4B" flood-opacity="0.4"/>
    </filter>

    <!-- 背景高光 -->
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景圆角方形（应用图标底） -->
  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="232" fill="url(#glow)"/>

  <!-- 底层紫卡（左倾，放大） -->
  <g transform="rotate(-16 468 480)">
    <rect x="148" y="270" width="640" height="420" rx="38" fill="url(#purpleCard)"/>
  </g>

  <!-- 中层蓝卡（右倾，放大） -->
  <g transform="rotate(16 556 480)">
    <rect x="236" y="270" width="640" height="420" rx="38" fill="url(#blueCard)"/>
  </g>

  <!-- 顶层白卡（放大） -->
  <g filter="url(#shadow)">
    <rect x="172" y="307" width="680" height="430" rx="42" fill="url(#whiteCard)"/>

    <!-- 金色 EMV 芯片 -->
    <rect x="248" y="428" width="118" height="82" rx="16" fill="url(#gold)"/>
    <rect x="259" y="439" width="96" height="60" rx="9" fill="none" stroke="#92400E" stroke-width="3"/>
    <line x1="259" y1="469" x2="355" y2="469" stroke="#92400E" stroke-width="3"/>
    <line x1="307" y1="439" x2="307" y2="499" stroke="#92400E" stroke-width="3"/>

    <!-- 蓝色 NFC 无感支付波纹（标准 NFC 图标样式，随卡片放大） -->
    <!-- 中心圆点 -->
    <circle cx="672" cy="520" r="11" fill="#2563EB"/>
    <!-- 第1道弧（小） -->
    <path d="M 694 494 A 32 32 0 0 1 694 546" fill="none" stroke="#2563EB" stroke-width="13" stroke-linecap="round"/>
    <!-- 第2道弧（中） -->
    <path d="M 718 474 A 52 52 0 0 1 718 566" fill="none" stroke="#2563EB" stroke-width="13" stroke-linecap="round"/>
    <!-- 第3道弧（大） -->
    <path d="M 742 454 A 72 72 0 0 1 742 586" fill="none" stroke="#2563EB" stroke-width="13" stroke-linecap="round"/>
  </g>
</svg>